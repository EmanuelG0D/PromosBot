name: Radar de ofertas

on:
  schedule:
    # Cada 15 minutos. En repositorios publicos los minutos de Actions son
    # ilimitados. GitHub puede retrasar la ejecucion en horas pico: el cron
    # marca el minimo, no el momento exacto.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # permite lanzarlo a mano desde la pestana Actions

# Evita que dos rondas se pisen si una se demora.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # El historial de precios vive en la cache: sin el, el bot repetiria
      # alertas en cada ronda y no podria detectar caidas reales.
      - name: Restaurar historial
        uses: actions/cache/restore@v6
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: Ejecutar radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python radar.py

      - name: Tamano del historial
        if: always()
        run: ls -lh radar.db 2>/dev/null || echo "sin base todavia"

      - name: Guardar historial
        if: always()
        uses: actions/cache/save@v6
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
