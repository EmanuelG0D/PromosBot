name: Radar de ofertas

on:
  schedule:
    # Cada 15 minutos, pero en minutos "raros" a proposito. GitHub encola los
    # cron programados y el minuto :00 es el mas congestionado del planeta:
    # correr en :07, :22, :37 y :52 reduce la espera. En repositorios publicos
    # los minutos de Actions son ilimitados.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:        # permite lanzarlo a mano desde la pestana Actions

# Evita que dos rondas se pisen si una se demora.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # El historial de precios vive en la cache: sin el, el bot repetiria
      # alertas en cada ronda y no podria detectar caidas reales.
      - name: Restaurar historial
        uses: actions/cache/restore@v6
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: Ejecutar radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python radar.py

      - name: Tamano del historial
        if: always()
        run: ls -lh radar.db 2>/dev/null || echo "sin base todavia"

      - name: Guardar historial
        if: always()
        uses: actions/cache/save@v6
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
